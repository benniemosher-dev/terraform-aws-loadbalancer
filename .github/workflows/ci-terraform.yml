name: BennieMosher.dev CI for Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ci-terraform:
    name: Continuous Integration for Terraform
    uses: "benniemosher-dev/.github/.github/workflows/ci-terraform.yml@b88a42eca09d2e7c4c2055c2c8dfffc6c8222004" # v1.2.5
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
