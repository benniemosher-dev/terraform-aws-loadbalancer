name: BennieMosher.dev CI for Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ci-terraform:
    name: Continuous Integration for Terraform
    uses: "benniemosher-dev/.github/.github/workflows/ci-terraform.yml@c904d2d0e05fa781e58c17c14dda869e27ebb3a9" # v1.2.4
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
