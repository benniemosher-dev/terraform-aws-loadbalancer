name: BennieMosher.dev CI for Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ci-terraform:
    name: Continuous Integration for Terraform
    uses: "benniemosher-dev/.github/.github/workflows/ci-terraform.yml@851fd3dfb4d887d79dc24bfe78f6f328d34dc221" # v1.2.3
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
