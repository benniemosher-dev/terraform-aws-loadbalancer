name: BennieMosher.dev CI for Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ci-terraform:
    name: Continuous Integration for Terraform
    uses: "benniemosher-dev/.github/.github/workflows/ci-terraform.yml@db8156445cc8da73f49cdb019a12060a3e655a40" # v1.0.3
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
