name: BennieMosher.dev CI for Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ci-terraform:
    name: Continuous Integration for Terraform
    uses: "benniemosher-dev/.github/.github/workflows/ci-terraform.yml@85058563a656a5e7f5e2147e593ec6a58aba85f3" # v1.2.7
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
