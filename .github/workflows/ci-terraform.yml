name: BennieMosher.dev CI for Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ci-terraform:
    name: Continuous Integration for Terraform
    uses: "benniemosher-dev/.github/.github/workflows/ci-terraform.yml@67edb842805d75055fb204bb2937f076ccce672e" # v1.0.2
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
