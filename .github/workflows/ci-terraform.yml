name: BennieMosher.dev CI for Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ci-terraform:
    name: Continuous Integration for Terraform
    uses: "benniemosher-dev/.github/.github/workflows/ci-terraform.yml@bbbe112ecfbb1882a8abf513864bbba78bee78ff" # v1.2.6
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
